name: Build final assignment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "_build_final.py"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build DOCX
        run: |
          python -m pip install --quiet python-docx
          python _build_final.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Практическое_занятие_2_GTA.docx"
          git commit -m "Fix practical assignment 2 structure and formatting"
          git push

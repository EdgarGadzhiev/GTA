name: Extract assignment documents
on:
  push:
    branches: [main]
    paths-ignore:
      - "_extracted/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract text
        run: |
          python -m pip install --quiet python-docx pypdf
          mkdir -p _extracted
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from pypdf import PdfReader

          for p in Path('.').glob('*.docx'):
              d=Document(p)
              lines=[]
              for para in d.paragraphs:
                  if para.text.strip():
                      lines.append(para.text)
              for ti,t in enumerate(d.tables):
                  lines.append(f"\n[TABLE {ti+1}]")
                  for row in t.rows:
                      lines.append(" | ".join(c.text.strip().replace("\n"," ") for c in row.cells))
              Path('_extracted',p.stem+'.txt').write_text("\n".join(lines),encoding='utf-8')

          for p in Path('.').glob('*.pdf'):
              r=PdfReader(str(p))
              out=[]
              for i,page in enumerate(r.pages,1):
                  try: txt=page.extract_text() or ''
                  except Exception as e: txt=f'[EXTRACTION ERROR: {e}]'
                  out.append(f"\n=== PAGE {i} ===\n{txt}")
              Path('_extracted',p.stem+'.txt').write_text("\n".join(out),encoding='utf-8')
          PY
      - name: Commit extracted text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _extracted
          git diff --cached --quiet && exit 0
          git commit -m "Temporary: extract assignment documents"
          git push
